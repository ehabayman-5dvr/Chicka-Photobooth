<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Chicka Puffs Photobooth</title>

    <meta name="title" content="Chicka Puffs Photobooth" />

    <link rel="icon" href="/favicon.ico" />
